name: Build and Push Docker Image on Release

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to build (e.g., v1.0.0)'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  build-image:
    name: Build Docker Image and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Image Tag Name
        run: |
          if [ x${{ github.event.inputs.version_tag }} == x"" ]; then
            echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GPR_TOKEN }}

      - name: Prepare Image Tags
        run: |
          echo "TAG=${{ env.VERSION }}" >> $GITHUB_ENV
          echo "TAG_GPR=ghcr.io/${{ github.repository_owner }}/docker-mirror-monitor:${{ env.VERSION }}" >> $GITHUB_ENV

      - name: Build and push Docker image to GPR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x
          push: true
          tags: |
            ${{ env.TAG_GPR }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x
          push: true
          tags: |
            ${{ env.TAG_DOCKERHUB }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
