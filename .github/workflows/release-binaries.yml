name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  APP_NAME: docker-mirror-monitor
  GO_VERSION: '1.24.12'

jobs:
  # Job 1: 手动触发时构建二进制文件并创建Release
  build-and-release:
    name: Build Binaries and Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: write
    
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: 7
            suffix: linux-armv7
          - goos: linux
            goarch: ppc64le
            suffix: linux-ppc64le
          - goos: linux
            goarch: s390x
            suffix: linux-s390x
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Get version from input
        id: version
        run: echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Build binaries
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          BUILD_TIME=$(date +%Y%m%d%H%M%S)
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}"
          
          OUTPUT_NAME="${{ env.APP_NAME }}-${VERSION}-${{ matrix.suffix }}"
          go build -ldflags="${LDFLAGS}" -o "dist/${OUTPUT_NAME}" main.go
          
          # Create checksum
          cd dist
          printf "# Version: %s\n" "${VERSION}" > ${OUTPUT_NAME}.sha256
          sha256sum ${OUTPUT_NAME} >> ${OUTPUT_NAME}.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            <table>
              <thead>
                <tr>
                  <th>Architecture</th>
                  <th>OS</th>
                  <th>Download</th>
                  <th>SHA256</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><img src="https://img.shields.io/badge/ARCH-amd64-2ea44f?style=flat" /></td>
                  <td><img src="https://img.shields.io/badge/OS-Linux-fabd14?style=flat" /></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-amd64">Download</a></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-amd64.sha256">SHA256</a></td>
                </tr>
                <tr>
                  <td><img src="https://img.shields.io/badge/ARCH-arm64-1f6feb?style=flat" /></td>
                  <td><img src="https://img.shields.io/badge/OS-Linux-fabd14?style=flat" /></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-arm64">Download</a></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-arm64.sha256">SHA256</a></td>
                </tr>
                <tr>
                  <td><img src="https://img.shields.io/badge/ARCH-armv7-1f6feb?style=flat" /></td>
                  <td><img src="https://img.shields.io/badge/OS-Linux-fabd14?style=flat" /></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-armv7">Download</a></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-armv7.sha256">SHA256</a></td>
                </tr>
                <tr>
                  <td><img src="https://img.shields.io/badge/ARCH-ppc64le-8b5cf6?style=flat" /></td>
                  <td><img src="https://img.shields.io/badge/OS-Linux-fabd14?style=flat" /></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-ppc64le">Download</a></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-ppc64le.sha256">SHA256</a></td>
                </tr>
                <tr>
                  <td><img src="https://img.shields.io/badge/ARCH-s390x-8b5cf6?style=flat" /></td>
                  <td><img src="https://img.shields.io/badge/OS-Linux-fabd14?style=flat" /></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-s390x">Download</a></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-s390x.sha256">SHA256</a></td>
                </tr>
                <tr>
                  <td><img src="https://img.shields.io/badge/ARCH-amd64-2ea44f?style=flat" /></td>
                  <td><img src="https://img.shields.io/badge/OS-Windows-0078d4?style=flat" /></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-windows-amd64.exe">Download</a></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-windows-amd64.exe.sha256">SHA256</a></td>
                </tr>
                <tr>
                  <td><img src="https://img.shields.io/badge/ARCH-amd64-2ea44f?style=flat" /></td>
                  <td><img src="https://img.shields.io/badge/OS-macOS-000000?style=flat" /></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-darwin-amd64">Download</a></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-darwin-amd64.sha256">SHA256</a></td>
                </tr>
                <tr>
                  <td><img src="https://img.shields.io/badge/ARCH-arm64-1f6feb?style=flat" /></td>
                  <td><img src="https://img.shields.io/badge/OS-macOS-000000?style=flat" /></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-darwin-arm64">Download</a></td>
                  <td><a href="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-darwin-arm64.sha256">SHA256</a></td>
                </tr>
              </tbody>
            </table>
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
